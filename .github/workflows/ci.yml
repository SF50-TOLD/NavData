name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            swift: "6.3"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: SwiftyLab/setup-swift@v1.14.2
        with:
          swift-version: ${{ matrix.swift }}
      - name: Cache SwiftPM build products
        uses: actions/cache@v6.1.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-build-${{ matrix.os }}-swift${{ matrix.swift }}-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build -v
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.4
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache SwiftPM build products
        uses: actions/cache@v6.1.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-build-linux-ubuntu-latest-swift6.4-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build -v
  documentation:
    name: Build Documentation
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: SwiftyLab/setup-swift@v1.14.2
        with:
          swift-version: "6.4"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6.1.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-docs-macos-26-swift6.4-${{ hashFiles('Package.resolved') }}
      - name: Build documentation
        run: |
          swift package \
           --allow-writing-to-directory "$RUNNER_TEMP/docs" \
           generate-documentation --target NavData --output-path "$RUNNER_TEMP/docs" \
           --warnings-as-errors
  lint:
    name: Run SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict
  swift-format:
    name: Run swift-format
    runs-on: ubuntu-latest
    container:
      image: swift:6.4
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download .swift-format config
        run: |
          apt-get update && apt-get install -y wget
          wget -O .swift-format https://gist.githubusercontent.com/RISCfuture/e0c21afb7bd80a88d128a42bf40d2ecd/raw/.swift-format
      - name: Run swift-format lint
        run: swift format lint --strict -r .
